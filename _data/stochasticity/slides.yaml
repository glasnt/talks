  text: Kia ora
- alt: ''
  image: images/slide_1.png
  text: "The Paper \"On the Dangers of Sto-chas-tic Parrots: Can Language Models Be\
    \ Too<br>Big? \U0001F99C\"<br>By Bender, Gebru, (et all)<br>Is arguably one of\
    \ the most impactful scientific articles published in the this decade.<br>It has\
    \ brought about a reconsideration of some of the fundamental elements in our<br>industry,\
    \ and has caused much friction amongst vendors and platforms.<br>Oh, and also\
    \ the llm stuff, guess.<br>Because I'm interested in just part of the title."
- alt: ''
  image: images/slide_2.png
  text: Not the colon, a perfectly cromulent part of any paper or presentation title,
    thank you<br>very much
- alt: ''
  image: images/slide_3.png
  text: I'm interested in the end of this title.
- alt: ''
  image: images/slide_4.png
  text: I'm interested in the end of this title.<br>This bit
- alt: ''
  image: images/slide_5.png
  text: This parrot.<br>Now, this might be an unfamiliar parrot to you
- alt: Parrot on Android 9 (2018)
  image: images/slide_6.png
  text: Because it is a version of the Parrot emoji available on Android 9 in 2018.<br>Depending
    on what platform you're viewing the original emoji on, the parrot will look<br>very
    different
- alt: 'Eclectus

    roratus

