    Ornithologist approved

    leadbeateri'
  image: images/slide_7.png
  text: A cursory avian identification of some of the options available results birds
    from most<br>all tropical climates of every continent.<br>However, none of these renderings are accurate based on the original
    subject.
- alt: Parrot on Telegram Telemoji (November 2023)
  image: images/slide_8.png
  text: The closest rendering is the Telegram Telelmoji, seen to act much like the
    original<br>parrot that the emoji is based on.<br>
- alt: Parrot on Telegram Telemoji (November 2023)
  image: images/slide_9.png
  text: We know this because we can read the submission to the unicode consortium,
    and<br>see the justification for addition
- alt: UTC Document Registry L2/17-280
  image: images/slide_10.png
  text: "From the original submission,<br>\"The inclusion of TROPICAL BIRD in the\
    \ Unicode Standard<br>would assist with platform compatibility with the popular\
    \ emoticon \u201CParty Parrot\u201D"
- alt: Party Parrot
  image: images/slide_11.png
  text: This is party parrot.<br>This parrot is based on a very specific parrot, based on Sirocco, the kakapo,
    a<br>native parrot of aotearoa
- alt: 'Eclectus

    roratus

    Aratinga

